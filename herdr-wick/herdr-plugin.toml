id = "wick"
name = "wick compress"
version = "0.1.0"
# The manifest uses only fields that 0.8.0 already parsed. A higher floor would
# make the local binary refuse to link it, and nothing here needs a newer API.
min_herdr_version = "0.8.0"
description = "Compress the focused wick agent pane: summarize the session and restart it in place"
platforms = ["linux", "macos"]

[[actions]]
id = "compress"
title = "Compress focused pane"
contexts = ["pane", "workspace"]
command = ["bash", "compress.sh"]
