<style>
  :root { color-scheme: dark; --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1); }
  * { border-color: #3a3a3c; }
  body { background: #212121; color: #ececec; -webkit-font-smoothing: antialiased; }
  button, a, input, select, textarea { transition: color .18s var(--ease-smooth), background-color .18s var(--ease-smooth), border-color .18s var(--ease-smooth), box-shadow .18s var(--ease-smooth), opacity .18s, transform .18s var(--ease-smooth); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
  .animate-rise { animation: rise .35s var(--ease-smooth) both; }
  @media (prefers-reduced-motion: reduce) { .animate-rise { animation: none; } * { transition: none !important; } }
  /* switch: real size h-5 w-9, 44px hit area via ::before */
  .sw { position: relative; display: inline-flex; height: 1.25rem; width: 2.25rem; align-items: center; border-radius: 9999px; background: #48484a; flex-shrink: 0; }
  .sw::before { content: ""; position: absolute; inset: -0.75rem -0.375rem; }
  .sw i { display: block; width: 1rem; height: 1rem; margin-left: 2px; border-radius: 9999px; background: #212121; transition: transform .18s var(--ease-smooth); }
  .sw[aria-checked="true"] { background: #ececec; }
  .sw[aria-checked="true"] i { transform: translateX(1rem); }
  .seg button[aria-pressed="true"] { background: #ececec; color: #171717; }
  select, input, textarea { color-scheme: dark; }
  ::-webkit-scrollbar { width: 12px; height: 12px; background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(155,155,161,.25); border-radius: 9999px; border: 4px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(155,155,161,.55); background-clip: content-box; }
  [data-pill] { transition: transform .3s var(--ease-smooth); }
  #aside { transition: width .3s var(--ease-smooth); }
  #drawer { transition: transform .3s var(--ease-smooth); }
  #scrim { transition: opacity .3s; }
</style>
</head>
<body class="font-sans antialiased">

<!--
  DESIGN BRIEF (for the model that builds the real thing). Mock covers /settings/*, /quota and /providers.

  SHELL (matches emberloop-web/web today; do not add a third column)
  1. Desktop: Rail (w-14, bg-sidebar, 5 area icons + sliding pill, collapse toggle on top)
     | Second sidebar (w-64, bg-sidebar, p-3, contextual list, account footer) | Main (bg-background).
     The page-specific navigation lives ONLY in the second sidebar. The page itself never draws its own side nav.
  2. Second sidebar per area:
       Settings          -> Workspace group (Agents, Runs, Context & names, Memory, Users & access) + You group (Profile, Notifications, Sound & voice).
       Quota (rail icon) -> Quota, Providers, then a "Live status" list: one row per provider with a tone dot and percent.
     Quota no longer collapses the second sidebar to w-0 (it does today). Memory keeps its own rules.
  3. Phones (<md): Rail and second sidebar are hidden. Top bar has the Menu button. The Sheet drawer (w-80, max-w-[88vw])
     holds: header (User, Sign out, Close) | the SAME second-sidebar list in one scroll region | pinned DrawerNav (5 tabs) | build stamp.
     /settings on a phone renders the HUB in the main area (grouped list, icon tile + label + hint + chevron); each sub-page shows a
     "< Settings" link above its title. On desktop /settings redirects to /settings/agents.
  4. Every phone control is a 44px target (Button/Input/select max-md:h-11, switch hit area, seg buttons), inputs are 16px (text-base),
     popovers never exceed 100vw - 1rem, safe-area padding on the drawer and the save bar. Cards stack to one column; row controls drop under their label.

  TOKENS (from app.css, dark only; never hardcode other colors)
     background #212121 | card #2a2a2a | popover #2f2f2f | sidebar #171717 (rail + second sidebar) | muted #303030 | accent #383838 (hover/active row)
     foreground #ececec | muted-foreground #9b9ba1 | primary #ececec / primary-foreground #171717 (switch on, active seg, default Button)
     border #3a3a3c | input #48484a (input border, switch off) | ring #0a84ff (focus only) | destructive #f87171
     Status uses Badge variants: success green-500/10 + green-300, warning amber-500/10 + amber-300, destructive destructive/10.
     Quota bars follow thresholdClass: calm <60 green-500, warm <80 amber-500, hot >=80 red-500 on a muted track (h-1.5).
  SHAPES: Button and Badge = rounded-full. Input/select = rounded-xl h-11 (md:h-10 inside dense rows), border-input, bg-transparent. Cards rounded-2xl border bg-card.
     Font stack: system (-apple-system, SF Pro). Icons: @lucide/svelte. Motion: animate-rise on new blocks, --ease-smooth everywhere.

  SETTINGS PAGES
  5. One page = one concern, scope Badge (outline) next to the title: Global | You | Admin | You · this device.
  6. Agents merges "role" rows and "Run Chains" into ONE ordered chain per role. Every entry has harness + model + thinking effort.
     Entry 1 is Primary, others are Fallbacks (used on quota, credit, auth or session-limit failure).
  7. Rows: label + hint on the left, control on the right. No nested lists. Shared save bar appears on first change; applies to new agents/Runs only.

  QUOTA (/quota, read-only, global)
  8. Every card shows percent used 0-100 first; dollars/tokens are secondary text. Providers: Claude, Gemini (Antigravity), ChatGPT Plus,
     OpenCode-Go, OpenRouter. Live (the Daemon serves cached values at once and refreshes in the background; no spinner wall).
     Card states: ok | stale (refresh failing, last values + age) | expired (host login expired, links to Providers) | not connected.
     The "Preview" control in the mock only demonstrates states; it is not part of the product.

  PROVIDERS (/providers, global connections, admin-only writes)
  9. Rows grouped: Subscription logins (Claude, ChatGPT, Gemini via Antigravity), API keys (paste; masked after save), CLI-only (command hint + copy).
     Connect opens an inline panel under the row (never a modal on phones): Claude = pty `claude auth login` (writes ~/.claude only),
     ChatGPT = device code, Antigravity = paste the redirect URL, API key = password field. Non-admins see status only; buttons are disabled with a lock.
 10. Project scope: Settings, Quota and Providers are global, so the second sidebar shows NO project switcher here. /p/<id>/settings is a separate shell.
-->

<div class="flex h-dvh overflow-hidden" id="app">
  <!-- Rail 1 -->
  <nav id="rail" class="relative flex w-14 shrink-0 flex-col items-center gap-1 border-r bg-sidebar py-3 max-md:hidden" aria-label="Areas"></nav>
  <!-- Second sidebar -->
  <aside id="aside" class="flex shrink-0 flex-col overflow-hidden border-r bg-sidebar max-md:hidden w-64">

<!-- Mock-only controls (not product) -->
<div id="mockTools" class="fixed bottom-3 right-3 z-[60] hidden items-center gap-2 rounded-full border border-dashed bg-popover/90 px-3 py-1.5 text-xs text-muted-foreground backdrop-blur md:flex">
  <span>Mock</span>
  <button id="phoneBtn" class="inline-flex items-center gap-1 rounded-full px-2 py-1 hover:bg-muted hover:text-foreground"><i data-lucide="smartphone" class="size-3.5"></i>Phone view</button>
  <button id="adminBtn" class="inline-flex items-center gap-1 rounded-full px-2 py-1 hover:bg-muted hover:text-foreground"><i data-lucide="shield" class="size-3.5"></i><span id="adminLbl">Admin</span></button>

<script>
  // ---------- tiny view helpers (classes mirror src/lib/ui) ----------
  const I = (n, c = 'size-4') => `<i data-lucide="${n}" class="${c}"></i>`;
  const BTN = 'inline-flex shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-full text-sm font-medium outline-none focus-visible:ring-[3px] focus-visible:ring-ring/40 active:scale-[0.97] disabled:pointer-events-none disabled:opacity-40';
  const BV = { default: 'bg-primary text-primary-foreground hover:bg-primary/85', outline: 'border border-border hover:bg-muted', ghost: 'hover:bg-muted', secondary: 'bg-muted hover:bg-accent', destructive: 'bg-destructive text-white hover:bg-destructive/90' };
  const BS = { default: 'h-9 px-4 max-md:h-11', sm: 'h-8 px-3 text-xs max-md:h-11 max-md:text-sm', icon: 'size-9 max-md:size-11', 'icon-sm': 'size-8 max-md:size-11' };
  const btn = (label, { v = 'outline', s = 'sm', icon = '', attrs = '', cls = '' } = {}) => `<button type="button" class="${BTN} ${BV[v]} ${BS[s]} ${cls}" ${attrs}>${icon ? I(icon) : ''}${label}</button>`;

  const BADGE = { default: 'bg-primary text-primary-foreground', secondary: 'bg-muted text-muted-foreground', outline: 'border border-border text-muted-foreground', success: 'bg-green-500/10 text-green-300', warning: 'bg-amber-500/10 text-amber-300', destructive: 'bg-destructive/10 text-destructive' };
  const badge = (t, v = 'secondary', icon = '') => `<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2.5 py-0.5 text-xs font-medium ${BADGE[v]}">${icon ? I(icon, 'size-3') : ''}${t}</span>`;
  const INPUT = 'h-11 md:h-10 w-full rounded-xl border border-input bg-transparent px-3.5 text-base md:text-sm shadow-xs outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/30 disabled:opacity-50';
  const input = (attrs = '', cls = '') => `<input class="${INPUT} ${cls}" ${attrs} />`;
  const select = (opts, val, attrs = '', cls = '') => `<select class="${INPUT} ${cls}" ${attrs}>${opts.map((o) => `<option ${o === val ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  const sw = (on, attrs = 'data-dirty') => `<button class="sw" role="switch" aria-checked="${on}" ${attrs}><i></i></button>`;
  const CARD = 'divide-y divide-border overflow-hidden rounded-2xl border bg-card';
  const tile = (icon, cls = 'bg-muted') => `<span class="grid size-9 shrink-0 place-items-center rounded-xl ${cls}">${I(icon)}</span>`;
  const row = (label, hint, ctl, { wide = '' } = {}) => `<div class="grid items-center gap-3 p-4 md:grid-cols-[1fr_${wide || 'auto'}]"><div class="min-w-0"><div class="text-sm font-medium">${label}</div><div class="text-xs text-muted-foreground">${hint}</div></div><div class="min-w-0">${ctl}</div></div>`;
  const group = (title, note, body) => `<section class="animate-rise flex flex-col gap-2"><div class="px-1"><h2 class="text-sm font-semibold">${title}</h2>${note ? `<p class="text-xs text-muted-foreground">${note}</p>` : ''}</div>${body}</section>`;
  const SCOPE = { global: 'Global', you: 'You', admin: 'Admin', device: 'You · this device', readonly: 'Global · read-only', adminw: 'Global · admin writes' };
  function head(icon, title, scope, desc, { back = '', extra = '' } = {}) {
    return `<header class="animate-rise flex flex-col gap-2">${back}<div class="flex flex-wrap items-center gap-2.5">${tile(icon, 'bg-card')}<h1 class="text-3xl font-semibold tracking-tight max-md:text-2xl">${title}</h1>${badge(SCOPE[scope], 'outline')}<div class="ml-auto">${extra}</div></div>${desc ? `<p class="text-sm text-muted-foreground">${desc}</p>` : ''}</header>`;
  }
  const backLink = `<a href="#/settings" class="-ml-2 inline-flex w-fit items-center gap-1 rounded-full px-2 py-1 text-sm text-muted-foreground hover:text-foreground max-md:min-h-11 md:hidden">${I('chevron-left')}Settings</a>`;

  // ---------- areas, nav model ----------
  const AREAS = [
    { id: 'chat', label: 'Chat', short: 'Chat', icon: 'message-square', href: '#/chat' },
    { id: 'runs', label: 'Specs and Runs', short: 'Runs', icon: 'layers', href: '#/runs' },
    { id: 'memory', label: 'Memory', short: 'Memory', icon: 'brain', href: '#/memory' },
    { id: 'quota', label: 'Quota and Providers', short: 'Quota', icon: 'gauge', href: '#/quota' },
    { id: 'settings', label: 'Settings', short: 'Settings', icon: 'settings', href: '#/settings' },
  ];
  const SETTINGS_NAV = [
    { title: 'Workspace', items: [
      { id: 'agents', label: 'Agents', icon: 'bot', hint: 'Models, effort and fallbacks per role' },
      { id: 'runs', label: 'Runs', icon: 'ticket', hint: 'Ticket concurrency' },
      { id: 'context', label: 'Context & names', icon: 'layers', hint: 'Compression, Session names' },
      { id: 'memory', label: 'Memory', icon: 'brain', hint: 'Deciders and Jev' },
      { id: 'access', label: 'Users & access', icon: 'shield-check', hint: 'Sign-up, Users' },
    ] },
    { title: 'You', items: [
      { id: 'profile', label: 'Profile', icon: 'user', hint: 'What agents know about you' },
      { id: 'notifications', label: 'Notifications', icon: 'bell', hint: 'Push on this device' },
      { id: 'sound-voice', label: 'Sound & voice', icon: 'volume-2', hint: 'Sounds, dictation, install' },
    ] },
  ];
  const SETTINGS_ITEMS = SETTINGS_NAV.flatMap((g) => g.items);
  const ACCOUNT_NAV = [
    { id: 'quota', label: 'Quota', icon: 'gauge', href: '#/quota' },
    { id: 'providers', label: 'Providers', icon: 'plug', href: '#/providers' },
  ];

  // ---------- state ----------
  let admin = true;
  let claudeState = 'ok';
  const state = { collapsed: false };

  function route() {
    const h = (location.hash.replace(/^#\/?/, '') || 'settings').split('/');
    const desktop = innerWidth >= 768;
    let area = h[0];
    let page = h[1] || '';
    if (area === 'providers') area = 'providers';
    if (area === 'settings' && desktop && !page) page = 'agents';
    if (area === 'settings' && page && !SETTINGS_ITEMS.find((i) => i.id === page)) page = desktop ? 'agents' : '';
    return { area, page, railArea: area === 'providers' ? 'quota' : area, desktop };
  }

  // ---------- second-sidebar content (also the phone drawer body) ----------
  const NAVI = 'flex items-center gap-2.5 rounded-xl px-2.5 py-2 text-sm max-md:min-h-11 hover:bg-accent hover:text-foreground';
  const navItem = (href, icon, label, on, extra = '') => `<a href="${href}" ${on ? 'aria-current="page"' : ''} class="${NAVI} ${on ? 'bg-accent text-foreground' : 'text-muted-foreground'}">${I(icon, 'size-4 shrink-0')}<span class="min-w-0 flex-1 truncate">${label}</span>${extra}</a>`;
  const TONE = (p) => (p < 60 ? 'calm' : p < 80 ? 'warm' : 'hot');
  const BAR = { calm: 'bg-green-500', warm: 'bg-amber-500', hot: 'bg-red-500' };
  const PCT = { calm: 'text-muted-foreground', warm: 'text-amber-300', hot: 'text-red-400' };

  function sidebarHTML(r) {
    if (r.railArea === 'settings') {
      return `<div class="px-2 pt-1.5 pb-1"><h1 class="text-base font-semibold tracking-tight">Settings</h1></div>
        <div class="relative"><span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-foreground">${I('search')}</span>${input('id="q" type="search" placeholder="Search settings" aria-label="Search settings"', 'h-9 rounded-full bg-muted pl-10 pr-3 border-transparent max-md:h-11')}</div>
        <nav class="flex min-h-0 flex-1 flex-col gap-3 overflow-auto" data-nav>${settingsNavHTML(r)}</nav>`;
    }
    if (r.railArea === 'quota') {
      return `<div class="px-2 pt-1.5 pb-1"><h1 class="text-base font-semibold tracking-tight">Quota and Providers</h1></div>
        <nav class="flex min-h-0 flex-1 flex-col gap-3 overflow-auto">
          <div class="flex flex-col gap-0.5">${ACCOUNT_NAV.map((i) => navItem(i.href, i.icon, i.label, i.id === r.area)).join('')}</div>
          <div class="flex flex-col gap-0.5"><div class="flex items-center justify-between px-2 pb-1"><span class="text-xs font-medium text-muted-foreground">Live status</span><span class="inline-flex items-center gap-1 text-[11px] text-muted-foreground"><span class="size-1.5 animate-pulse rounded-full bg-green-500"></span>live</span></div>
            ${QUOTA.map((p) => { const top = p.w.length ? Math.max(...p.w.map((w) => w[1] ?? 0)) : null; const t = TONE(top ?? 0); return `<a href="#/quota" class="${NAVI} text-muted-foreground"><span class="size-2 shrink-0 rounded-full ${top == null ? 'bg-input' : BAR[t]}"></span><span class="min-w-0 flex-1 truncate">${p.name}</span><span class="text-xs tabular-nums ${top == null ? 'text-muted-foreground' : PCT[t]}">${top == null ? '—' : top + '%'}</span></a>`; }).join('')}
          </div></nav>`;
    }
    return `<div class="px-2 pt-1.5 pb-1"><h1 class="text-base font-semibold tracking-tight">${AREAS.find((a) => a.id === r.railArea).label}</h1></div>
      <p class="px-2 text-sm text-muted-foreground">Not part of this mock. The real list keeps its current second sidebar.</p>`;
  }
  function settingsNavHTML(r, term = '') {
    term = term.trim().toLowerCase();
    return SETTINGS_NAV.map((g) => {
      const items = g.items.filter((i) => !term || (i.label + ' ' + i.hint).toLowerCase().includes(term));
      if (!items.length) return '';
      return `<div class="flex flex-col gap-0.5"><div class="px-2 pb-1 text-xs font-medium text-muted-foreground">${g.title}</div>${items.map((i) => navItem('#/settings/' + i.id, i.icon, i.label, i.id === r.page)).join('')}</div>`;
    }).join('') || '<p class="px-2 text-sm text-muted-foreground">No match.</p>';
  }
  const footHTML = `<div class="flex items-center gap-2 border-t pt-3"><span class="grid size-8 shrink-0 place-items-center rounded-full bg-muted text-xs font-semibold uppercase">c</span><div class="min-w-0 flex-1 leading-tight"><p class="truncate text-sm font-medium">cioky</p><p class="text-xs text-muted-foreground">${admin ? 'Admin' : 'User'}</p></div><button class="${BTN} ${BV.ghost} ${BS['icon-sm']}" aria-label="Sign out" title="Sign out">${I('log-out')}</button></div>`;

  // ---------- rail ----------
  function railHTML(r) {
    const idx = Math.max(0, AREAS.findIndex((a) => a.id === r.railArea));
    return `<button id="toggleSide" title="${state.collapsed ? 'Expand' : 'Collapse'} sidebar (Ctrl/⌘+B)" aria-label="Toggle sidebar" class="relative grid size-11 shrink-0 place-items-center rounded-xl text-muted-foreground hover:text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/40 focus-visible:outline-none">${I(state.collapsed ? 'panel-left-open' : 'panel-left-close', 'size-[18px]')}</button>
      <div class="my-1 h-px w-8 shrink-0 bg-border"></div>
      <div class="relative flex flex-col items-center gap-1"><span data-pill class="pointer-events-none absolute left-1/2 top-0 size-11 -translate-x-1/2 rounded-xl bg-accent" style="transform:translate(-50%,${idx * 3}rem)"></span>

      ${select(MODELS[e.h], e.m, 'data-k="m"', 'min-w-0')}
      <div class="flex justify-end gap-0.5 lg:col-start-4 lg:row-start-1">${mv('up', i === 0, 'arrow-up', 'Move up')}${mv('down', i === n - 1, 'arrow-down', 'Move down')}${mv('del', n === 1, 'trash-2', 'Remove entry')}</div>
      <div class="flex items-center gap-2 lg:col-span-3 lg:col-start-2"><span class="flex shrink-0 items-center gap-1 text-xs text-muted-foreground">${I('brain-circuit', 'size-3.5')}Effort</span><div class="seg flex min-w-0 flex-1 rounded-full bg-muted p-1 text-xs" data-k="e">${EFFORTS.map((x) => `<button type="button" class="flex-1 rounded-full px-1.5 py-1.5 max-md:min-h-11 ${x === 'Default' && x !== e.e ? '' : ''}" aria-pressed="${x === e.e}">${x}</button>`).join('')}</div></div>
    </div>`;
  }
  function roleCard(r) {
    const n = r.chain.length;
    return `<div class="p-4" data-role="${r.id}"><div class="mb-3 flex items-start justify-between gap-3"><div class="flex min-w-0 items-start gap-3">${tile(r.icon)}<div class="min-w-0"><div class="text-sm font-medium">${r.label}</div><div class="text-xs text-muted-foreground">${r.hint}</div></div></div>
      <button type="button" data-act="add" class="${BTN} ${BV.outline} ${BS.sm} ${n >= 3 ? 'pointer-events-none opacity-40' : ''}">${I('plus')}Fallback</button></div>
      <div class="divide-y divide-border/60 rounded-xl border bg-background/40 p-3">${r.chain.map((e, i) => entryRow(e, i, n)).join('')}</div></div>`;
  }
  const agentsPage = () => head('bot', 'Agents', 'global', 'Pick the harness, model and thinking effort for each role. Add fallbacks: the next entry runs only when the one above is out of quota, credit, auth or session capacity. Changes apply to new agents and new Runs.', { back: backLink })
    + GROUPS.map((g) => group(`<span class="flex items-center gap-2">${I(g.icon, 'size-4 text-muted-foreground')}${g.title}</span>`, g.note, `<div class="${CARD}" data-agents>${g.roles.map(roleCard).join('')}</div>`)).join('');

  // ---------- hub (phone /settings) ----------
  const hubPage = () => head('settings', 'Settings', 'global', '')
    + SETTINGS_NAV.map((g) => group(g.title, '', `<div class="${CARD}">${g.items.map((i) => `<a href="#/settings/${i.id}" class="flex min-h-16 items-center gap-3 p-4 hover:bg-muted">${tile(i.icon)}<span class="min-w-0 flex-1"><span class="block text-sm font-medium">${i.label}</span><span class="block truncate text-xs text-muted-foreground">${i.hint}</span></span>${I('chevron-right', 'size-4 text-muted-foreground')}</a>`).join('')}</div>`)).join('')
    + group('Accounts', 'Own area in the rail.', `<div class="${CARD}">${ACCOUNT_NAV.map((i) => `<a href="${i.href}" class="flex min-h-16 items-center gap-3 p-4 hover:bg-muted">${tile(i.icon)}<span class="min-w-0 flex-1 text-sm font-medium">${i.label}</span>${I('arrow-up-right', 'size-4 text-muted-foreground')}</a>`).join('')}</div>`);

  // ---------- render ----------
  const $ = (id) => document.getElementById(id);
  function render() {
    const r = route();
    $('rail').innerHTML = railHTML(r);
    const side = sidebarHTML(r);
    $('asideBody').innerHTML = side;
    $('asideBody').classList.remove('animate-rise'); void $('asideBody').offsetWidth; $('asideBody').classList.add('animate-rise');
    $('asideFoot').innerHTML = footHTML;
    $('drawerBody').innerHTML = side;
    $('drawerTabs').innerHTML = tabsHTML(r);
    $('aside').style.width = state.collapsed ? '0px' : '';
    $('aside').classList.toggle('border-transparent', state.collapsed);
    let html, title;
    if (r.area === 'quota') { html = quotaPage(); title = 'Quota'; }
    else if (r.area === 'providers') { html = providersPage(); title = 'Providers'; }
    else if (r.area === 'settings') {
      if (!r.page) { html = hubPage(); title = 'Settings'; }
      else { html = r.page === 'agents' ? agentsPage() : SET[r.page](); title = SETTINGS_ITEMS.find((i) => i.id === r.page).label; }
    } else { html = head(AREAS.find((a) => a.id === r.area)?.icon || 'circle', AREAS.find((a) => a.id === r.area)?.label || 'Page', 'global', 'Not part of this mock.'); title = 'Emberloop'; }
    $('page').innerHTML = html;
    $('mtitle').textContent = title;
    $('bar').classList.add('opacity-0');
    lucide.createIcons();
    bindSearch(r);
  }
  function bindSearch(r) {
    document.querySelectorAll('#q').forEach((q) => q.addEventListener('input', () => {
      document.querySelectorAll('[data-nav]').forEach((n) => { n.innerHTML = settingsNavHTML(r, q.value); });
      lucide.createIcons();
    }));
  }
  addEventListener('hashchange', () => { if (!window.__keep) closeDrawer(); render(); });
  addEventListener('resize', () => { render(); });

  // ---------- drawer ----------
  const drawer = $('drawer'), scrim = $('scrim');
  function openDrawer() { drawer.classList.remove('-translate-x-full'); scrim.classList.remove('opacity-0', 'pointer-events-none'); }
  function closeDrawer() { drawer.classList.add('-translate-x-full'); scrim.classList.add('opacity-0', 'pointer-events-none'); }
  $('menuBtn').onclick = openDrawer; $('drawerClose').onclick = closeDrawer; scrim.onclick = closeDrawer;

  // ---------- interactions ----------
  const bar = $('bar');
  function dirty() { if (route().area !== 'settings') return; bar.classList.remove('opacity-0'); $('barmsg').textContent = 'Unsaved changes'; ['revert', 'save'].forEach((i) => $(i).classList.remove('hidden')); }
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    if (t.closest('#toggleSide')) { state.collapsed = !state.collapsed; render(); return; }
    const s = t.closest('.sw'); if (s) { s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true'); dirty(); return; }
    const cs = t.closest('[data-cs]'); if (cs) { claudeState = cs.dataset.cs; render(); return; }
    const g = t.closest('.seg[data-group] button'); if (g) { g.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === g)); dirty(); return; }
    const a = t.closest('[data-act][data-id]');
    if (a) {
      const all = [...PROV.login, ...PROV.keys]; const p = all.find((x) => x.id === a.dataset.id);
      if (a.dataset.act === 'open') openPanel[p.id] = true;
      if (a.dataset.act === 'close') delete openPanel[p.id];
      if (a.dataset.act === 'save') { p.connected = true; if (p.how === 'key') p.line = 'sk-…' + Math.random().toString(16).slice(2, 6); delete openPanel[p.id]; }
      if (a.dataset.act === 'remove') { p.connected = false; p.line = 'Removed just now'; }
      render(); return;
    }
    const ag = t.closest('[data-agents]');
    if (ag) {
      const b = t.closest('button'); if (!b) return;
      const card = b.closest('[data-role]'); const r = findRole(card.dataset.role);
      const row = b.closest('[data-entry]'); const idx = row ? [...card.querySelectorAll('[data-entry]')].indexOf(row) : -1;
      const act = b.dataset.act;
      if (act === 'add' && r.chain.length < 3) r.chain.push({ ...r.chain[r.chain.length - 1] });
      else if (act === 'del' && r.chain.length > 1) r.chain.splice(idx, 1);
      else if (act === 'up' && idx > 0) [r.chain[idx - 1], r.chain[idx]] = [r.chain[idx], r.chain[idx - 1]];
      else if (act === 'down' && idx < r.chain.length - 1) [r.chain[idx + 1], r.chain[idx]] = [r.chain[idx], r.chain[idx + 1]];
      else if (b.closest('.seg')) r.chain[idx].e = b.textContent.trim();
      else return;
      const y = $('scroller').scrollTop; render(); $('scroller').scrollTop = y; dirty();
    }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.closest('[data-agents]') && el.dataset.k) {
      const card = el.closest('[data-role]'); const r = findRole(card.dataset.role);
      const idx = [...card.querySelectorAll('[data-entry]')].indexOf(el.closest('[data-entry]'));
      if (el.dataset.k === 'h') { r.chain[idx].h = el.value; r.chain[idx].m = MODELS[el.value][0]; }
      if (el.dataset.k === 'm') r.chain[idx].m = el.value;
      const y = $('scroller').scrollTop; render(); $('scroller').scrollTop = y;
    }
    if (el.hasAttribute('data-dirty') || el.closest('[data-agents]')) dirty();
  });
  document.addEventListener('input', (ev) => { if (ev.target.hasAttribute('data-dirty')) dirty(); });
  $('save').onclick = () => { $('barmsg').innerHTML = '<span class="text-green-300">Saved. Applies to new agents and Runs.</span>'; ['revert', 'save'].forEach((i) => $(i).classList.add('hidden')); setTimeout(() => bar.classList.add('opacity-0'), 1800); };
  $('revert').onclick = () => location.reload();
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); state.collapsed = !state.collapsed; render(); } });

  // ---------- mock-only tools ----------
  const embed = new URLSearchParams(location.search).has('embed');
  if (!embed) {
  $('adminBtn').onclick = () => { admin = !admin; $('adminLbl').textContent = admin ? 'Admin' : 'User'; render(); };
  $('phoneBtn').onclick = () => { $('phoneFrame').src = location.pathname + '?embed' + location.hash; $('phoneOverlay').classList.remove('hidden'); $('phoneOverlay').classList.add('flex'); };
  $('phoneClose').onclick = () => { $('phoneOverlay').classList.add('hidden'); $('phoneOverlay').classList.remove('flex'); };
  } else { $('mockTools').remove(); }

  render();
  if (new URLSearchParams(location.search).has('drawer')) { window.__keep = true; drawer.style.transition = scrim.style.transition = 'none'; openDrawer(); }
</script>
</body>
</html>
